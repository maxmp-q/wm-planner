<section class="login-wrapper">
  <label class="login-label">
    Bitte gibt den Boardnamen ein:
    <input
      class="login-input"
      type="text"
      [(ngModel)]="username"
    >
  </label>
  <label class="login-label">
    Bitte gibt das Passwort ein:
    <input
      class="login-input"
      type="password"
      [(ngModel)]="password"
    >
  </label>
  <button (click)="loginButton()" class="login-button">Login</button>
</section>
