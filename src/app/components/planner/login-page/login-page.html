<section class="login-wrapper">
  <label class="login-label">
    Bitte gib den Boardnamen ein:
    <input
      class="login-input"
      type="text"
      [(ngModel)]="username"
    >
  </label>
  <label class="login-label">
    Bitte gib das Passwort ein:
    <input
      class="login-input"
      type="password"
      [(ngModel)]="password"
    >
  </label>
  @if(loading()){
    <app-spinner />
  } @else {
    <button (click)="loginButton()" class="login-button">Login</button>
  }
</section>
